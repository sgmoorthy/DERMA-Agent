name: Streamlit Smoke Test

on:
  push:
    branches: [main, master]
    paths:
      - "derma_agent/**"
      - "tools/**"
      - "app_enhanced.py"
      - ".streamlit/**"
      - ".github/workflows/streamlit-smoke.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-streamlit-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-streamlit-

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Upgrade build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install package (editable)
        run: pip install -e . --no-deps

      - name: Smoke test primary dashboard
        run: |
          code=0
          timeout 25s python -m streamlit run derma_agent/app.py --server.port 8507 || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi

      - name: Smoke test enhanced dashboard
        run: |
          code=0
          timeout 25s python -m streamlit run app_enhanced.py --server.port 8508 || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi
